# Mosquitto broker for MaintainIQ M6 live telemetry
# (contract: design/M6_LIVE_TELEMETRY.md).
#
# Mounted read-only into the eclipse-mosquitto:2 container by
# docker-compose.yml. Mosquitto 2.x refuses remote connections unless a
# listener is declared explicitly, so even the dev setup needs this file.

# --- Listener ------------------------------------------------------------
# Plain MQTT on 1883 for the dev stack (simulator, local app, ESP32 on the
# bench LAN).
listener 1883

# DEV ONLY: anyone who can reach port 1883 can publish telemetry and read the
# alert topics. Fine on a laptop or an isolated bench network; NOT fine on any
# shared or routable network. (docker-compose.yml binds the host port to
# 127.0.0.1 unless MQTT_BIND says otherwise.) For anything beyond dev, switch
# to password auth (and ideally TLS) using the commented block below, then set
# MQTT_USERNAME / MQTT_PASSWORD in .env (used by the app AND the compose
# healthcheck), MQTT_TLS=1 + MQTT_COMPOSE_BROKER_PORT=8883 for the app
# container (MQTT_BROKER_PORT=8883 for a host-side app),
# `--username/--password/--tls` for the simulator, and the matching values in
# firmware/esp32-node/include/config.h.
allow_anonymous true

# --- Hardened example (uncomment and adapt) --------------------------------
# Create the password file (./deploy/mosquitto/secrets on the host is
# bind-mounted writable at /mosquitto/secrets and gitignored, so the file
# survives container re-creation):
#   docker compose exec mosquitto mosquitto_passwd -c /mosquitto/secrets/passwd maintainiq
# then `docker compose restart mosquitto`.
#
# allow_anonymous false
# password_file /mosquitto/secrets/passwd
#
# listener 8883
# cafile   /mosquitto/certs/ca.crt
# certfile /mosquitto/certs/server.crt
# keyfile  /mosquitto/certs/server.key
# tls_version tlsv1.2

# --- Persistence ---------------------------------------------------------
# Persist retained messages (device status, downstream alerts) and the QoS-1
# queue of the app's persistent session (MQTT_CLIENT_ID + clean_session=False),
# so telemetry published while the app is down survives a broker restart too.
# This is the "cloud-side" half of the buffering story; the edge buffer on the
# device covers network drops between device and broker.
persistence true
persistence_location /mosquitto/data/

# --- Size limits ---------------------------------------------------------
# Contract §3: max snapshot payload is 1 MiB (a 32768-sample f32le-b64 XJTU-SY
# snapshot is ~350 KB). Reject larger messages at the broker instead of
# relaying them to ingest, which would reject them anyway.
# message_size_limit caps the PAYLOAD; max_packet_size caps the whole MQTT
# packet (fixed header + topic + properties + payload), so it gets 1 KiB of
# headroom above the payload cap -- otherwise a payload just under 1 MiB would
# be refused for its header bytes.
message_size_limit 1048576
max_packet_size 1049600

# Queue enough QoS-1 messages for an app outage of a few minutes at the
# simulator's default rate (3 devices x 1 snapshot / 2 s). 0 would mean
# unlimited, which can exhaust broker memory during a long outage.
max_queued_messages 1000

# The ESP32 firmware publishes telemetry with PubSubClient, which can only
# publish at QoS 0 (the LWT and alert subscription are QoS 1). Without this,
# Mosquitto silently drops QoS-0 messages for a disconnected persistent
# session, so real-device snapshots published while the app is down would be
# lost even though simulator (QoS 1) snapshots are queued. Queue them too.
queue_qos0_messages true

# --- Logging -------------------------------------------------------------
# stdout so `docker compose logs mosquitto` shows connects, LWTs, and drops.
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
