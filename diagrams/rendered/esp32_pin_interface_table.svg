<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="524px" preserveAspectRatio="none" style="width:1505px;height:524px;background:#FFFFFF;" version="1.1" viewBox="0 0 1505 524" width="1505px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs/><g><g class="title" data-source-line="1"><text fill="#1F2937" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="179.7373" x="659.3833" y="24.5332">ESP32 Pin / Interface Table</text></g><g class="entity" data-qualified-name="GMN1" data-source-line="10" id="ent0002"><path d="M481.0479,44.6094 L481.0479,103.6641 A0,0 0 0 0 481.0479,103.6641 L744.0479,103.6641 L748.0479,143.3894 L752.0479,103.6641 L1015.1226,103.6641 A0,0 0 0 0 1015.1226,103.6641 L1015.1226,54.6094 L1005.1226,44.6094 L481.0479,44.6094 A0,0 0 0 0 481.0479,44.6094" fill="#F9FAFB" style="stroke:#374151;stroke-width:0.5;"/><path d="M1005.1226,44.6094 L1005.1226,54.6094 L1015.1226,54.6094 L1005.1226,44.6094" fill="#F9FAFB" style="stroke:#374151;stroke-width:0.5;"/><text fill="#1F2937" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="52.0317" x="487.0479" y="63.1045">Purpose:</text><text fill="#1F2937" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="477.6484" x="487.0479" y="79.4561">Documents how each sensor or communication module can connect to the ESP32.</text><text fill="#1F2937" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="513.0747" x="487.0479" y="95.8076">The pins are suggested defaults for design documentation, not final board-specific wiring.</text></g><g class="start_entity" data-qualified-name="start" data-source-line="10" id="ent0003"><ellipse cx="748.0479" cy="153.6094" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN5" data-source-line="28" id="ent0006"><path d="M455.5479,203.6094 L455.5479,311.7188 A0,0 0 0 0 455.5479,311.7188 L1040.9561,311.7188 A0,0 0 0 0 1040.9561,311.7188 L1040.9561,213.6094 L1030.9561,203.6094 L752.0479,203.6094 L748.0479,163.6594 L744.0479,203.6094 L455.5479,203.6094 A0,0 0 0 0 455.5479,203.6094" fill="#F9FAFB" style="stroke:#374151;stroke-width:0.5;"/><path d="M1030.9561,203.6094 L1030.9561,213.6094 L1040.9561,213.6094 L1030.9561,203.6094" fill="#F9FAFB" style="stroke:#374151;stroke-width:0.5;"/><text fill="#1F2937" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="436.4775" x="461.5479" y="222.1045">Pin numbers are suggested documentation defaults, not fixed requirements.</text><text fill="#1F2937" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="564.4082" x="461.5479" y="238.4561">Final pin choice should avoid ESP32 boot-strapping pins and match the exact development board.</text><text fill="#1F2937" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118" x="461.5479" y="254.8076">&#160;</text><text fill="#1F2937" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="46.9917" x="461.5479" y="271.1592">Legend:</text><text fill="#1F2937" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="387.3276" x="461.5479" y="287.5107">GPIO means general-purpose digital pin. ADC means analog input.</text><text fill="#1F2937" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="428.4731" x="461.5479" y="303.8623">I2C and SPI are digital sensor buses. UART is used for serial/RS485 links.</text></g><g class="legend" data-source-line="15"><rect fill="none" height="172.4844" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1;" width="1474.5039" x="12" y="332.7188"/><text fill="#1F2937" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="102.6689" x="20.8896" y="354.252">Module / Signal</text><text fill="#1F2937" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="181.2891" x="306.4951" y="354.252">Suggested ESP32 Interface</text><text fill="#1F2937" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="138.5166" x="495.5635" y="354.252">Example ESP32 Pins</text><text fill="#1F2937" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="60.6758" x="774.1006" y="354.252">Direction</text><text fill="#1F2937" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="89.4619" x="939.0859" y="354.252">Design Notes</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="185.2129" x="20.8896" y="371.8613">DS18B20 temperature sensor</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="81.6895" x="306.4951" y="371.8613">1-Wire digital</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="183.2715" x="495.5635" y="371.8613">GPIO 4 + 4.7k pull-up to 3.3V</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="107.3994" x="774.1006" y="371.8613">Sensor to ESP32</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="518.3076" x="939.0859" y="371.8613">Good prototype choice; one GPIO can support multiple DS18B20 sensors if needed</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="162.6475" x="20.8896" y="389.4707">ADXL345 vibration sensor</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="21.7861" x="306.4951" y="389.4707">I2C</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="180.5166" x="495.5635" y="389.4707">SDA GPIO 21, SCL GPIO 22</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="107.3994" x="774.1006" y="389.4707">Sensor to ESP32</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="538.5283" x="939.0859" y="389.4707">Short local wiring preferred; use 3.3V logic; address can be changed on many modules</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="210.8818" x="20.8896" y="407.0801">MPU6050 vibration/motion sensor</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="21.7861" x="306.4951" y="407.0801">I2C</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="180.5166" x="495.5635" y="407.0801">SDA GPIO 21, SCL GPIO 22</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="107.3994" x="774.1006" y="407.0801">Sensor to ESP32</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="431.1289" x="939.0859" y="407.0801">Alternative to ADXL345; useful if MPU6050 module is easier to obtain</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="277.8262" x="20.8896" y="424.6895">Thermocouple module MAX6675/MAX31855</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="22.5654" x="306.4951" y="424.6895">SPI</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="266.8613" x="495.5635" y="424.6895">SCK GPIO 18, MISO GPIO 19, CS GPIO 5</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="157.2061" x="774.1006" y="424.6895">Sensor module to ESP32</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="390.667" x="939.0859" y="424.6895">Future/high-temperature option; uses more pins than DS18B20</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="162.6543" x="20.8896" y="442.2988">Local debug/programming</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="123.6963" x="306.4951" y="442.2988">USB serial / UART0</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="130.7236" x="495.5635" y="442.2988">USB cable, TX0/RX0</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="82.4893" x="774.1006" y="442.2988">PC to ESP32</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="340.0605" x="939.0859" y="442.2988">Used for programming, logs, and synthetic-data testing</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="171.1992" x="20.8896" y="459.9082">Optional RS485 transceiver</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="38.1104" x="306.4951" y="459.9082">UART</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="270.7578" x="495.5635" y="459.9082">TX GPIO 17, RX GPIO 16, DE/RE GPIO 25</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="145.5303" x="774.1006" y="459.9082">ESP32 to industrial bus</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="411.6396" x="939.0859" y="459.9082">Future industrial alternative for wired long-distance communication</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="94.1104" x="20.8896" y="477.5176">Wi-Fi telemetry</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="87.8896" x="306.4951" y="477.5176">2.4 GHz Wi-Fi</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="125.2891" x="495.5635" y="477.5176">Built-in ESP32 radio</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="152.5439" x="774.1006" y="477.5176">ESP32 to gateway/cloud</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="437.3223" x="939.0859" y="477.5176">Carries MQTT telemetry and alert topics; no external data pins needed</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="166.5234" x="20.8896" y="495.127">Status LED / alert indicator</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="77.7998" x="306.4951" y="495.127">Digital GPIO</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="155.6133" x="495.5635" y="495.127">GPIO 2 or external GPIO</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="115.958" x="774.1006" y="495.127">ESP32 to indicator</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="333.8193" x="939.0859" y="495.127">Optional local feedback for connectivity or critical alert</text><line style="stroke:#1F2937;stroke-width:1;" x1="17" x2="1481.5039" y1="339.7188" y2="339.7188"/><line style="stroke:#1F2937;stroke-width:1;" x1="17" x2="1481.5039" y1="357.3281" y2="357.3281"/><line style="stroke:#1F2937;stroke-width:1;" x1="17" x2="1481.5039" y1="374.9375" y2="374.9375"/><line style="stroke:#1F2937;stroke-width:1;" x1="17" x2="1481.5039" y1="392.5469" y2="392.5469"/><line style="stroke:#1F2937;stroke-width:1;" x1="17" x2="1481.5039" y1="410.1563" y2="410.1563"/><line style="stroke:#1F2937;stroke-width:1;" x1="17" x2="1481.5039" y1="427.7656" y2="427.7656"/><line style="stroke:#1F2937;stroke-width:1;" x1="17" x2="1481.5039" y1="445.3