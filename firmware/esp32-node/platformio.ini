; MaintainIQ ESP32 vibration node (design/M6_LIVE_TELEMETRY.md section 11).
;
; Build:   pio run
; Flash:   pio run -t upload
; Monitor: pio device monitor
;
; Library majors are pinned (^) so a breaking ArduinoJson 8 / PubSubClient 3
; cannot slip in on a fresh checkout; the platform is pinned to the 6.x line
; (Arduino-ESP32 2.0.x / ESP-IDF 4.4), which is what this code was written
; and compile-checked against.

[env:esp32dev]
platform = espressif32 @ ^6.9.0
board = esp32dev
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Edge buffer lives on LittleFS; partitions.csv gives it 2 MB.
board_build.filesystem = littlefs
board_build.partitions = partitions.csv

; C++17 for constexpr helpers / static_assert messages used in app_config.h.
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3
    -Wall

lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.2.0
