services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      # Optional (Compose >= 2.24): the README calls copying .env.example
      # optional, and every value here has a working default without it.
      - path: .env
        required: false
    environment:
      - MAINTAINIQ_DB_PATH=/app/data/maintainiq.db
      # Container-to-container hostname, not the host-side SMTP_HOST in .env
      # (which dev processes running outside Docker would use instead).
      - SMTP_HOST=mailpit
      # M6 live telemetry: same reasoning -- inside the compose network the
      # broker is the `mosquitto` service on its container port, whatever
      # MQTT_BROKER_HOST/PORT in .env say for host-side dev processes.
      # Clearing MQTT_BROKER_HOST in .env does NOT disable ingest here; remove
      # these two lines to run the container without MQTT.
      # The port is the broker's CONTAINER port, deliberately a separate
      # variable from MQTT_BROKER_PORT (which host-side processes use and which
      # may point at a remapped host port). Set MQTT_COMPOSE_BROKER_PORT=8883
      # together with MQTT_TLS=1 once the TLS listener in mosquitto.conf is on.
      - MQTT_BROKER_HOST=mosquitto
      - MQTT_BROKER_PORT=${MQTT_COMPOSE_BROKER_PORT:-1883}
      # Device health: run the background scheduler (silence watchdog) every
      # 5 s unless .env sets a value; 0 turns it off.
      - MAINTAINIQ_SWEEP_INTERVAL_S=${MAINTAINIQ_SWEEP_INTERVAL_S:-5}
    volumes:
      # Bind-mount so the DB generated by `python -m src.training.run_pipeline`
      # on the host (see README) is what the container serves, and so it
      # survives container restarts/rebuilds. maintainiq.db lives at the repo
      # root (src/storage/db.py DEFAULT_DB_PATH), not in a ./data/ subfolder.
      - ./maintainiq.db:/app/data/maintainiq.db
    depends_on:
      mailpit:
        condition: service_started
      # Wait for a healthy broker so the ingest client's first CONNECT
      # succeeds; it reconnects on its own if the broker restarts later.
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Fake SMTP server for realtime email alerts (src/notifications/) — catches
  # all outgoing mail with zero external credentials. Web inbox on :8025,
  # SMTP on :1025 (see README for the demo walkthrough).
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_WEB_PORT:-8025}:8025"
    restart: unless-stopped

  # M6 live telemetry broker (design/M6_LIVE_TELEMETRY.md). Config is
  # deploy/mosquitto/mosquitto.conf: anonymous dev listener on 1883, 1 MiB
  # message cap, persistence so retained status/alerts and the app's queued
  # QoS-1 session survive restarts.
  #
  # The host port is bound to 127.0.0.1 by default, which is enough for the
  # simulator and a host-side `just serve`. The dev listener is anonymous and
  # the app auto-registers any machine that publishes, so exposing it on every
  # interface by default would let anyone on the same Wi-Fi create machines
  # and trigger alert emails. ESP32 nodes on the bench LAN need it reachable:
  # set MQTT_BIND=0.0.0.0 in .env for that (isolated networks only), or
  # enable password auth first (see mosquitto.conf).
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "${MQTT_BIND:-127.0.0.1}:${MQTT_PORT:-1883}:1883"
      # Only answers once the TLS listener in mosquitto.conf is uncommented.
      - "${MQTT_BIND:-127.0.0.1}:${MQTT_TLS_PORT:-8883}:8883"
    environment:
      # Credentials for the healthcheck below, so it keeps passing after the
      # broker is switched to `allow_anonymous false` (same MQTT_USERNAME /
      # MQTT_PASSWORD the app uses; empty = anonymous probe).
      - MQTT_HEALTHCHECK_USERNAME=${MQTT_USERNAME:-}
      - MQTT_HEALTHCHECK_PASSWORD=${MQTT_PASSWORD:-}
    volumes:
      - ./deploy/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      # Writable home for the password file of the hardened config, so
      # `mosquitto_passwd` output survives container re-creation (gitignored).
      - ./deploy/mosquitto/secrets:/mosquitto/secrets
      - mosquitto-data:/mosquitto/data
    healthcheck:
      # A real publish through the listener, not just "process is up".
      # -i keeps health probes distinguishable in the broker log. `$$` is
      # Compose's escape for a literal `$`: the variables expand in the
      # container's shell, and -u/-P are only passed when credentials are set.
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -p 1883 -i healthcheck $${MQTT_HEALTHCHECK_USERNAME:+-u \"$$MQTT_HEALTHCHECK_USERNAME\" -P \"$$MQTT_HEALTHCHECK_PASSWORD\"} -t maintainiq/healthcheck -m ok -q 0"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # Simulated ESP32 fleet (src/telemetry/simulator.py) -- opt-in, since it
  # publishes continuously:  docker compose --profile sim up -d
  # Same image as the app; edit `command` (or `docker compose run simulator
  # ...`) for other flags, e.g. --outage-every 60 or --source xjtu.
  simulator:
    build: .
    profiles: ["sim"]
    command: ["python", "-m", "src.telemetry.simulator", "--broker", "mosquitto", "--port", "1883", "--devices", "3"]
    volumes:
      # Read-only dataset for `--source xjtu` (its default --data-dir is the
      # relative path local_data/xjtu_full/..., resolved from /app). Absent
      # folder = empty mount; the synthetic source does not need it.
      - ./local_data:/app/local_data:ro
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mosquitto-data:
