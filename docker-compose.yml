services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - MAINTAINIQ_DB_PATH=/app/data/maintainiq.db
    volumes:
      # Bind-mount so the DB generated by `python -m src.training.run_pipeline`
      # on the host (see README) is what the container serves, and so it
      # survives container restarts/rebuilds.
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
