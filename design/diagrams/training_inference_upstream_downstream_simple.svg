<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#FF6B35"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#059669"/>
    </marker>
    <marker id="arrow-gray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#374151"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #111827; }
      .label { font: 700 18px Arial, sans-serif; fill: #1F2937; }
      .small { font: 15px Arial, sans-serif; fill: #374151; }
      .tiny { font: 13px Arial, sans-serif; fill: #4B5563; }
      .section { font: 700 16px Arial, sans-serif; fill: #374151; letter-spacing: .5px; }
      .cloud { fill: #F5F3FF; stroke: #7C3AED; stroke-width: 2; }
      .server { fill: #FFFFFF; stroke: #374151; stroke-width: 1.5; }
      .machine { fill: #EFF6FF; stroke: #2563EB; stroke-width: 2; }
      .sensor { fill: #FFFFFF; stroke: #374151; stroke-width: 1.5; }
      .training { fill: #ECFDF5; stroke: #059669; stroke-width: 2; }
      .debug { fill: #FEF3C7; stroke: #D97706; stroke-width: 1.5; }
      .store { fill: #ECFDF5; stroke: #059669; stroke-width: 1.5; }
      .blue { stroke: #2563EB; stroke-width: 4; fill: none; marker-end: url(#arrow-blue); }
      .orange { stroke: #FF6B35; stroke-width: 4; fill: none; marker-end: url(#arrow-orange); }
      .green { stroke: #059669; stroke-width: 3; fill: none; marker-end: url(#arrow-green); stroke-dasharray: 10 8; }
      .gray { stroke: #374151; stroke-width: 2.5; fill: none; marker-end: url(#arrow-gray); }
      .debugline { stroke: #D97706; stroke-width: 3; fill: none; marker-end: url(#arrow-orange); stroke-dasharray: 9 7; }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/>
  <text x="60" y="58" class="title">Offline Training, Runtime Inference, Upstream Telemetry, and Downstream Alerts</text>

  <rect x="450" y="95" width="1040" height="330" rx="8" class="cloud"/>
  <text x="475" y="126" class="section">CLOUD / BACKEND RUNTIME</text>

  <rect x="500" y="160" width="155" height="74" rx="6" class="server"/>
  <text x="526" y="189" class="label">MQTT Broker</text>
  <text x="520" y="213" class="tiny">telemetry + alert topics</text>

  <rect x="705" y="160" width="185" height="74" rx="6" class="server"/>
  <text x="730" y="188" class="label">Backend Listener</text>
  <text x="724" y="213" class="tiny">long-running MQTT worker</text>

  <rect x="940" y="160" width="190" height="74" rx="6" class="server"/>
  <text x="958" y="188" class="label">Feature Extraction</text>
  <text x="967" y="213" class="tiny">windows, RMS, mean, peaks</text>

  <rect x="1180" y="160" width="225" height="74" rx="6" class="server"/>
  <text x="1212" y="188" class="label">FastAPI Inference</text>
  <text x="1201" y="213" class="tiny">calls deployed trained model</text>

  <rect x="830" y="300" width="205" height="74" rx="6" class="store"/>
  <text x="860" y="329" class="label">Telemetry Store</text>
  <text x="852" y="353" class="tiny">raw + processed history</text>

  <rect x="1090" y="300" width="180" height="74" rx="6" class="store"/>
  <text x="1115" y="329" class="label">Model Artifact</text>
  <text x="1126" y="353" class="tiny">model.pkl / ONNX</text>

  <rect x="1320" y="300" width="135" height="74" rx="6" class="server"/>
  <text x="1346" y="329" class="label">Alerts</text>
  <text x="1337" y="353" class="tiny">risk + severity</text>

  <path d="M655 197 H705" class="gray"/>
  <path d="M890 197 H940" class="gray"/>
  <path d="M1130 197 H1180" class="gray"/>
  <path d="M797 234 V300 H830" class="gray"/>
  <path d="M1292 234 V285 H1180 V300" class="gray"/>
  <path d="M1405 234 V300" class="gray"/>

  <rect x="70" y="120" width="300" height="250" rx="8" class="training"/>
  <text x="95" y="152" class="section">LOCAL OFFLINE TRAINING</text>
  <rect x="105" y="185" width="230" height="50" rx="5" class="sensor"/>
  <text x="130" y="216" class="small">Dataset / collected samples</text>
  <rect x="105" y="260" width="230" height="50" rx="5" class="sensor"/>
  <text x="132" y="291" class="small">Python training script</text>
  <rect x="105" y="335" width="230" height="50" rx="5" class="store"/>
  <text x="144" y="366" class="small">Saved model artifact</text>
  <path d="M220 235 V260" class="gray"/>
  <path d="M220 310 V335" class="gray"/>

  <path d="M335 360 C560 440 915 430 1165 374" class="green"/>

  <rect x="250" y="535" width="860" height="280" rx="8" class="machine"/>
  <text x="275" y="566" class="section">MACHINE + SENSORS + ESP32 NODE</text>

  <rect x="295" y="610" width="170" height="60" rx="6" class="sensor"/>
  <text x="333" y="636" class="label">Machine</text>
  <text x="316" y="660" class="tiny">motor / pump / fan</text>

  <rect x="515" y="585" width="185" height="60" rx="6" class="sensor"/>
  <text x="545" y="612" class="label">Temperature</text>
  <text x="548" y="636" class="tiny">DS18B20 / thermocouple</text>

  <rect x="515" y="685" width="185" height="60" rx="6" class="sensor"/>
  <text x="560" y="712" class="label">Vibration</text>
  <text x="555" y="736" class="tiny">ADXL345 / MPU6050</text>

  <rect x="760" y="610" width="140" height="60" rx="6" class="server"/>
  <text x="790" y="637" class="label">ESP32</text>
  <text x="778" y="661" class="tiny">read + tag + buffer</text>

  <rect x="950" y="610" width="125" height="60" rx="6" class="server"/>
  <text x="972" y="637" class="label">MQTT</text>
  <text x="974" y="661" class="tiny">client</text>

  <path d="M465 640 H515" class="gray"/>
  <path d="M465 640 C500 640 500 615 515 615" class="gray"/>
  <path d="M700 615 H760" class="gray"/>
  <path d="M700 715 C735 715 735 660 760 660" class="gray"/>
  <path d="M900 640 H950" class="gray"/>

  <path d="M1013 610 C1040 455 540 420 540 234" class="blue"/>
  <rect x="1080" y="444" width="285" height="82" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="1105" y="475" class="label" fill="#2563EB">UPSTREAM</text>
  <text x="1105" y="500" class="small" fill="#2563EB">ESP32 publishes telemetry</text>
  <text x="1105" y="520" class="tiny" fill="#2563EB">factory/{machineId}/telemetry</text>

  <path d="M540 234 C460 455 880 460 950 610" class="orange"/>
  <rect x="465" y="446" width="300" height="82" rx="8" fill="#FFF6F1" stroke="#FF6B35" stroke-width="1.5"/>
  <text x="490" y="477" class="label" fill="#FF6B35">DOWNSTREAM</text>
  <text x="490" y="502" class="small" fill="#FF6B35">backend publishes alert</text>
  <text x="490" y="522" class="tiny" fill="#FF6B35">factory/{machineId}/alert</text>

  <rect x="525" y="760" width="360" height="42" rx="6" class="debug"/>
  <text x="545" y="786" class="tiny" fill="#92400E">Serial USB debug: sensor values, JSON format, Wi-Fi/MQTT errors</text>

  <rect x="1180" y="610" width="310" height="130" rx="8" class="debug"/>
  <text x="1205" y="642" class="label">Key clarification</text>
  <text x="1205" y="674" class="small">Training is offline on the local machine.</text>
  <text x="1205" y="700" class="small">FastAPI/backend performs repeated inference.</text>
  <text x="1205" y="726" class="small">No single API request stays open forever.</text>

  <rect x="1180" y="765" width="310" height="70" rx="8" class="store"/>
  <text x="1205" y="794" class="label">Dashboard / Professor Review</text>
  <text x="1205" y="818" class="tiny">alerts, trends, recommendation, acknowledgement</text>
  <path d="M1387 374 V765" class="gray"/>
</svg>
