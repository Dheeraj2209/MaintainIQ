<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="538px" preserveAspectRatio="none" style="width:2257px;height:538px;background:#FFFFFF;" version="1.1" viewBox="0 0 2257 538" width="2257px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs/><g><g class="title" data-source-line="1"><text fill="#1F2937" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="154.0479" x="1048.3174" y="24.5332">Sensor Selection Table</text></g><g class="entity" data-qualified-name="GMN1" data-source-line="10" id="ent0002"><path d="M891.5139,44.6094 L891.5139,120.0156 A0,0 0 0 0 891.5139,120.0156 L1120.5139,120.0156 L1124.5139,159.2994 L1128.5139,120.0156 L1357.656,120.0156 A0,0 0 0 0 1357.656,120.0156 L1357.656,54.6094 L1347.656,44.6094 L891.5139,44.6094 A0,0 0 0 0 891.5139,44.6094" fill="#F9FAFB" style="stroke:#374151;stroke-width:0.5;"/><path d="M1347.656,44.6094 L1347.656,54.6094 L1357.656,54.6094 L1347.656,44.6094" fill="#F9FAFB" style="stroke:#374151;stroke-width:0.5;"/><text fill="#1F2937" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="52.0317" x="897.5139" y="63.1045">Purpose:</text><text fill="#1F2937" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="445.1421" x="897.5139" y="79.4561">Compares candidate temperature and vibration sensors for the ESP32-based</text><text fill="#1F2937" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="427.0894" x="897.5139" y="95.8076">predictive maintenance node, including interface type, best use, strengths,</text><text fill="#1F2937" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="278.2241" x="897.5139" y="112.1592">and tradeoffs for documentation-stage selection.</text></g><g class="start_entity" data-qualified-name="start" data-source-line="10" id="ent0003"><ellipse cx="1124.5139" cy="169.6094" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN5" data-source-line="28" id="ent0006"><path d="M881.5139,219.6094 L881.5139,344.0703 A0,0 0 0 0 881.5139,344.0703 L1367.1687,344.0703 A0,0 0 0 0 1367.1687,344.0703 L1367.1687,229.6094 L1357.1687,219.6094 L1128.5139,219.6094 L1124.5139,179.6094 L1120.5139,219.6094 L881.5139,219.6094 A0,0 0 0 0 881.5139,219.6094" fill="#F9FAFB" style="stroke:#374151;stroke-width:0.5;"/><path d="M1357.1687,219.6094 L1357.1687,229.6094 L1367.1687,229.6094 L1357.1687,219.6094" fill="#F9FAFB" style="stroke:#374151;stroke-width:0.5;"/><text fill="#1F2937" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="250.0215" x="887.5139" y="238.1045">Recommended academic prototype choice:</text><text fill="#1F2937" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="384.4331" x="887.5139" y="254.4561">DS18B20 for temperature and ADXL345 or MPU6050 for vibration.</text><text fill="#1F2937" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="464.6548" x="887.5139" y="270.8076">Mention thermocouple and industrial piezo sensors as future industrial upgrades.</text><text fill="#1F2937" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118" x="887.5139" y="287.1592">&#160;</text><text fill="#1F2937" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="46.9917" x="887.5139" y="303.5107">Legend:</text><text fill="#1F2937" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="409.6904" x="887.5139" y="319.8623">Rows marked as prototype-friendly are easier to explain, wire, and test.</text><text fill="#1F2937" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="427.0132" x="887.5139" y="336.2139">Industrial options improve realism but increase cost and circuit complexity.</text></g><g class="legend" data-source-line="16"><rect fill="none" height="154.875" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1;" width="2226.6826" x="12" y="365.0703"/><text fill="#1F2937" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="47.4619" x="20.8896" y="386.6035">Sensor</text><text fill="#1F2937" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="32.6758" x="316.2227" y="386.6035">Type</text><text fill="#1F2937" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="105.834" x="466.415" y="386.6035">ESP32 Interface</text><text fill="#1F2937" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="59.917" x="799.4961" y="386.6035">Best Use</text><text fill="#1F2937" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="65.3379" x="1170.667" y="386.6035">Strengths</text><text fill="#1F2937" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="114.3516" x="1695.9268" y="386.6035">Tradeoffs / Notes</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="59.9307" x="20.8896" y="404.2129">DS18B20</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="80.1445" x="316.2227" y="404.2129">Temperature</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="228.3545" x="466.415" y="404.2129">1-Wire digital GPIO + pull-up resistor</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="238.123" x="799.4961" y="404.2129">Prototype surface/contact temperature</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="468.46" x="1170.667" y="404.2129">Simple wiring, digital output, low cost, supports multiple sensors on one bus</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="533.8662" x="1695.9268" y="404.2129">Moderate response speed; needs correct physical mounting for good surface readings</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="287.5537" x="20.8896" y="421.8223">MAX6675 / MAX31855 + K-type thermocouple</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="80.1445" x="316.2227" y="421.8223">Temperature</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="22.5654" x="466.415" y="421.8223">SPI</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="363.3916" x="799.4961" y="421.8223">Hot motor body, high-temperature industrial-style use case</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="410.8535" x="1170.667" y="421.8223">Better for high temperatures; more credible for industrial machines</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="319.0742" x="1695.9268" y="421.8223">Costs more and needs thermocouple probe/module</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="35.0205" x="20.8896" y="439.4316">LM35</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="80.1445" x="316.2227" y="439.4316">Temperature</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="77.041" x="466.415" y="439.4316">Analog ADC</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="289.4541" x="799.4961" y="439.4316">Simple low-cost lab temperature measurement</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="142.4131" x="1170.667" y="439.4316">Very simple and cheap</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="435.7842" x="1695.9268" y="439.4316">Analog signal is more noise-sensitive; ADC calibration may be needed</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="59.9307" x="20.8896" y="457.041">ADXL345</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="142.4131" x="316.2227" y="457.041">Vibration / acceleration</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="64.5791" x="466.415" y="457.041">I2C or SPI</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="280.1436" x="799.4961" y="457.041">Recommended vibration sensor for prototype</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="517.4805" x="1170.667" y="457.041">Digital accelerometer, common, easy ESP32 interface, useful acceleration readings</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="320.6191" x="1695.9268" y="457.041">Placement and sampling rate affect vibration quality</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="62.2549" x="20.8896" y="474.6504">MPU6050</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="108.9443" x="316.2227" y="474.6504">Vibration / motion</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="21.7861" x="466.415" y="474.6504">I2C</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="357.957" x="799.4961" y="474.6504">Low-cost vibration approximation and motion experiments</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="394.5566" x="1170.667" y="474.6504">Cheap, widely available, includes accelerometer and gyroscope</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="423.3291" x="1695.9268" y="474.6504">Not an industrial vibration sensor; needs filtering for cleaner analysis</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="50.5723" x="20.8896" y="492.2598">SW-420</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="115.9648" x="316.2227" y="492.2598">Vibration detection</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="120.6133" x="466.415" y="492.2598">Digital output GPIO</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="236.5645" x="799.4961" y="492.2598">Basic vibration/no-vibration demo only</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="142.4131" x="1170.667" y="492.2598">Very cheap and simple</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="429.5498" x="1695.9268" y="492.2598">Not suitable for detailed vibration analysis or RMS/frequency features</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="196.8818" x="20.8896" y="509.8691">Industrial piezo vibration sensor</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="55.2549" x="316.2227" y="509.8691">Vibration</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="325.3018" x="466.415" y="509.8691">Analog with signal conditioning or industrial interface</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="272.3438" x="799.4961" y="509.8691">More realistic industrial condition monitoring</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="242.0332" x="1170.667" y="509.8691">Better vibration fidelity and ruggedness</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="416.2607" x="1695.9268" y="509.8691">Higher cost, more complex circuit, may need amplifier/ADC module</text><line style="stroke:#1F2937;stroke-width:1;" x1="17" x2="2233.6826" y1="372.0703" y2="372.0703"/><line style="stroke:#1F2937;stroke-width:1;" x1="17" x2="2233.6826" y1="389.6797" y2="389.6797"/><line style="stroke:#1F2937;stroke-width:1;" x1="17" x2="2233.6826" y1="407.2891" y2="407.2891"/><line style="stroke:#1F2937;stroke-width:1;" x1="17" x2="2233.6826" y1="424.8984" y2="424.8984"/><line style="stroke:#1F2937;stroke-width:1;" x1="17" x2="2233.6826" y1="442.5078" y2="442.5078"/><line style="stroke:#1F2937;stroke-width:1;" x1="17" x2="2233.6826" y1="460.1172" y2="460.1172"/><line style="stroke:#1F2937;stroke-width:1;" x1="17" x2="2233.6826" y1="477.7266" y2="477.7266"/><line style="stroke:#1F2937;stroke-width:1;" x1="17" x2="2233.6826" y1="495.3359" y2="495.3359"/><line style="stroke:#1F2937;stroke-width:1;" x1="17" x2="2233.6826" y1="512.9453" y2="512.9453"/><line style="stroke:#1F2937;stroke-width:1;" x1="17" x2="17" y1="372.0703" y2="512.9453"/><line style="stroke:#1F2937;stroke-width:1;" x1="312.333" x2="312.333" y1="372.0703" y2="512.9453"/><line style="stroke:#1F2937;stroke-width:1;" x1="462.5254" x2="462.5254" y1="372.0703" y2="512.9453"/><line style="stroke:#1F2937;stroke-width:1;" x1="795.6064" x2="795.6064" y1="372.0703" y2="512.9453"/><line style="stroke:#1F2937;stroke-width:1;" x1="1166.7773" x2="1166.7773" y1="372.0703" y2="512.9453"/><line style="stroke:#1F2937;stroke-width:1;" x1="1692.0371" x2="1692.0371" y1="372.0703" y2="512.9453"/><line style="stroke:#1F2937;stroke-width:1;" x1="2233.6826" x2="2233.6826" y1="372.0703" y2="512.9453"/></g><?plantuml-src PLR9SkCs4