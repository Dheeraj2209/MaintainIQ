<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="539px" preserveAspectRatio="none" style="width:2275px;height:539px;background:#FFFFFF;" version="1.1" viewBox="0 0 2275 539" width="2275px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs/><g><g class="title" data-source-line="1"><text fill="#1F2937" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="252.0137" x="1008.04" y="24.5332">Communication Protocol Comparison</text></g><g class="entity" data-qualified-name="GMN1" data-source-line="10" id="ent0002"><path d="M872.595,44.6094 L872.595,103.6641 A0,0 0 0 0 872.595,103.6641 L1129.095,103.6641 L1133.095,143.3894 L1137.095,103.6641 L1393.6125,103.6641 A0,0 0 0 0 1393.6125,103.6641 L1393.6125,54.6094 L1383.6125,44.6094 L872.595,44.6094 A0,0 0 0 0 872.595,44.6094" fill="#F9FAFB" style="stroke:#374151;stroke-width:0.5;"/><path d="M1383.6125,44.6094 L1383.6125,54.6094 L1393.6125,54.6094 L1383.6125,44.6094" fill="#F9FAFB" style="stroke:#374151;stroke-width:0.5;"/><text fill="#1F2937" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="52.0317" x="878.595" y="63.1045">Purpose:</text><text fill="#1F2937" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="500.0176" x="878.595" y="79.4561">Compares communication choices for moving machine data from ESP32 sensor nodes</text><text fill="#1F2937" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="381.583" x="878.595" y="95.8076">to a gateway/cloud and for sending alerts back to the edge device.</text></g><g class="start_entity" data-qualified-name="start" data-source-line="10" id="ent0003"><ellipse cx="1133.095" cy="153.6094" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN5" data-source-line="27" id="ent0006"><path d="M828.095,203.6094 L828.095,344.4219 A0,0 0 0 0 828.095,344.4219 L1437.9988,344.4219 A0,0 0 0 0 1437.9988,344.4219 L1437.9988,213.6094 L1427.9988,203.6094 L1137.095,203.6094 L1133.095,163.9094 L1129.095,203.6094 L828.095,203.6094 A0,0 0 0 0 828.095,203.6094" fill="#F9FAFB" style="stroke:#374151;stroke-width:0.5;"/><path d="M1427.9988,203.6094 L1427.9988,213.6094 L1437.9988,213.6094 L1427.9988,203.6094" fill="#F9FAFB" style="stroke:#374151;stroke-width:0.5;"/><text fill="#1F2937" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="224.7261" x="834.095" y="222.1045">Recommended communication design:</text><text fill="#1F2937" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="340.2852" x="834.095" y="238.4561">ESP32 nodes publish telemetry to MQTT topics over Wi-Fi.</text><text fill="#1F2937" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="476.9438" x="834.095" y="254.8076">The cloud/gateway publishes alerts back to each node on a machine-specific topic,</text><text fill="#1F2937" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="239.1987" x="834.095" y="271.1592">creating the required full-duplex behavior.</text><text fill="#1F2937" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118" x="834.095" y="287.5107">&#160;</text><text fill="#1F2937" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="46.9917" x="834.095" y="303.8623">Legend:</text><text fill="#1F2937" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="588.9038" x="834.095" y="320.2139">Full duplex means both directions are supported: telemetry upstream and alert/command downstream.</text><text fill="#1F2937" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="387.3022" x="834.095" y="336.5654">RS485/Modbus is kept as the industrial wired scalability alternative.</text></g><g class="legend" data-source-line="15"><rect fill="none" height="154.875" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1;" width="2244.0938" x="12" y="365.4219"/><text fill="#1F2937" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="97.2275" x="20.8896" y="386.9551">Protocol / Link</text><text fill="#1F2937" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="84.0068" x="174.1104" y="386.9551">Where It Fits</text><text fill="#1F2937" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="117.4688" x="422.3984" y="386.9551">Duplex Capability</text><text fill="#1F2937" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="65.3379" x="866.7686" y="386.9551">Strengths</text><text fill="#1F2937" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="63.7861" x="1390.4902" y="386.9551">Tradeoffs</text><text fill="#1F2937" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="117.4619" x="1947.626" y="386.9551">Recommendation</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="107.3174" x="20.8896" y="404.5645">MQTT over Wi-Fi</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="233.4883" x="174.1104" y="404.5645">ESP32 sensor node to gateway/cloud</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="257.585" x="422.3984" y="404.5645">Full duplex using publish/subscribe topics</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="515.9424" x="866.7686" y="404.5645">Lightweight, IoT-friendly, supports many machine nodes, natural alert-back channel</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="549.3564" x="1390.4902" y="404.5645">Needs Wi-Fi coverage and broker setup; secure deployment should use MQTT over TLS</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="174.3164" x="1947.626" y="404.5645">Recommended main design</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="145.4414" x="20.8896" y="422.1738">HTTP/REST over Wi-Fi</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="165.751" x="174.1104" y="422.1738">ESP32 to server/cloud API</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="436.5908" x="422.3984" y="422.1738">Mostly request/response; cloud-to-edge needs polling or extra channel</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="410.8945" x="866.7686" y="422.1738">Easy to understand, common web APIs, simple ingestion endpoint</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="423.3154" x="1390.4902" y="422.1738">Less efficient for frequent telemetry; not ideal for real-time alert push</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="183.6475" x="1947.626" y="422.1738">Good fallback, not first choice</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="139.248" x="20.8896" y="439.7832">WebSocket over Wi-Fi</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="174.3096" x="174.1104" y="439.7832">ESP32 or gateway to server</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="203.8955" x="422.3984" y="439.7832">Full duplex persistent connection</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="236.5439" x="866.7686" y="439.7832">Real-time bidirectional communication</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="401.5088" x="1390.4902" y="439.7832">More complex connection management than MQTT for IoT fleets</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="299.5781" x="1947.626" y="439.7832">Useful for dashboards or special real-time cases</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="97.2891" x="20.8896" y="457.3926">Bluetooth / BLE</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="240.5088" x="174.1104" y="457.3926">Sensor node to nearby phone/gateway</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="154.8613" x="422.3984" y="457.3926">Bidirectional, short range</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="349.4189" x="866.7686" y="457.3926">Low power, no Wi-Fi needed, good for local setup/config</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="352.4814" x="1390.4902" y="457.3926">Short range, weaker for multi-machine factory monitoring</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="227.2539" x="1947.626" y="457.3926">Mention as local configuration option</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="85.5723" x="20.8896" y="475.002">Serial / UART</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="221.7852" x="174.1104" y="475.002">Sensor module to local PC/gateway</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="138.5029" x="422.3984" y="475.002">Bidirectional wired link</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="273.957" x="866.7686" y="475.002">Simple, reliable for lab demo and debugging</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="464.5635" x="1390.4902" y="475.002">Short distance; not scalable across many machines without extra hardware</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="231.1641" x="1947.626" y="475.002">Good for testing/prototype debugging</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="136.9443" x="20.8896" y="492.6113">RS485 / Modbus RTU</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="226.4541" x="174.1104" y="492.6113">Machine area field wiring to gateway</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="192.2129" x="422.3984" y="492.6113">Bidirectional half-duplex typical</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="445.915" x="866.7686" y="492.6113">Industrial, long cable runs, noise-resistant, supports many nodes on bus</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="486.3701" x="1390.4902" y="492.6113">Needs RS485 transceiver and protocol handling; less plug-and-play than Wi-Fi</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="196.0957" x="1947.626" y="492.6113">Future industrial scalability path</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="111.2686" x="20.8896" y="510.2207">LoRa / LoRaWAN</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="218.668" x="174.1104" y="510.2207">Long-range low-data-rate telemetry</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="371.9912" x="422.3984" y="510.2207">Limited downlink; not ideal for continuous high-rate vibration</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="141.6475" x="866.7686" y="510.2207">Long range, low power</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="345.5293" x="1390.4902" y="510.2207">Low bandwidth, not suited for detailed vibration streams</text><text fill="#1F2937" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="223.3301" x="1947.626" y="510.2207">Not recommended for this prototype</text><line style="stroke:#1F2937;stroke-width:1;" x1="17" x2="2251.0938" y1="372.4219" y2="372.4219"/><line style="stroke:#1F2937;stroke-width:1;" x1="17" x2="2251.0938" y1="390.0313" y2="390.0313"/><line style="stroke:#1F2937;stroke-width:1;" x1="17" x2="2251.0938" y1="407.6406" y2="407.6406"/><line style="stroke:#1F2937;stroke-width:1;" x1="17" x2="2251.0938" y1="425.25" y2="425.25"/><line style="stroke:#1F2937;stroke-width:1;" x1="17" x2="2251.0938" y1="442.8594" y2="442.8594"/><line style="stroke:#1F2937;stroke-width:1;" x1="17" x2="2251.0938" y1="460.4688" y2="460.4688"/><line style="stroke:#1F2937;stroke-width:1;" x1="17" x2="2251.0938" y1="478.0781" y2="478.0781"/><line style="stroke:#1F2937;stroke-width:1;" x1="17" x2="2251.0938" y1="495.6875" y2="495.6875"/><line style="stroke:#1F2937;stroke-width:1;" x1="17" x2="2251.0938" y1="513.2969" y2="513.2969"/><line style="stroke:#1F2937;stroke-width:1;" x1="17" x2="17" y1="372.4219" y2="513.2969"/><line style="stroke:#1F2937;stroke-width:1;" x1="170.2207" x2="170.2207" y1="372.4219" y2="513.2969"/><line style="stroke:#1F2937;stroke-width:1;" x1="418.5088" x2="418.5088" y1="372.4219" y2="513.2969"/><line style="stroke:#1F2937;stroke-width:1;" x1="862.8789" x2="862.8789" y1="372.4219" y2="513.2969"/><line style="stroke:#1F2937;stroke-width:1;" x1="1386.6006" x2="1386.6006" y1="372.4219" y2="513.2969"/><line style="stroke:#1F2937;stroke-width:1;" x1="1943.7363" x2="1943.7363" y1="372.4219" y2="513.2969"/><line style="stroke:#1F2937;stroke-width:1;" x1="2251.0938" x2="2251.0938" y1="372.4219" y2="513.2969"/></g><?plantuml-src TLPDR-Cs4BthLn3erOwnNzXkWXwID6u3P1Tfx4NEb3IIY50SbQJYDP0VtpUaR2lPRGwnHPF3UM_Ucr4qqPAwvhuVdQbqDEpKlUV85LjP7hGtWLrHX2VZyA1xLUhggVKyklgQBNlrsphzpNQ4JjUyCwvLZRQ1Ph_KrEZHnZMxE1r-jtx_vSFdsHR7aQv-kkBB-d9zzNON-vhyjEF3vu_lFhqh2lb1HHwA-z4F7EYyo2WegEeLogfZKs6rmUcUdoNRNbUTSQHg7RLgFFVgPdF_uRqAv09sEQuf596LLgsEjDFxLMLvh9LsTGg3VRN4qPPy38aefA9YHuhg5d7f6LUU5TYM01I5fLOUAdAHVF7onudxbRepxabXwR4ZJ-esghL1K2pyEGwMVgXhFUZIM1FtihY9dbmRkxHZwtLDt3JfuO44EAx9k5-A5_Nrd-rMyJDvzMYMQwDUVWOgYRz6-QBMexMgphUFGP0EOsbDw5PXB4FbJPceDnNkHVfj5tSa_nVgbhVBnXiaOVSB5SPXO66ersv_P3tHkr1Enz5hcqbS9WwhJZj75a6_4TLXIheI01gq2lsbvoUI2iHnkC17DNhXUx2y1_G8IV9eQsHDC_3RkmrY7lcX6haOXsF1j9celxVR-zN3pUQNR86XG1xh4q6NzxVuxIk7QFVAqxyZXRY2y0PsWIvKshICl4nQS0d9mDOAZo2TVaIlPr1lTDZB5J01-H01Sf4KZ1Bkg9JBG5OmFQgX409tINK1Os03m2W0XQ2eQKnbX04HQ9EomaCaIpr5lxyG8IfJ4nYN7HvVbj7qbFb7WKE7M7ynrs9cA_LOf3EDGLQJYn9NZrHkk7gY-2kk47fIqucsDueQ0DE4AEbL31AgB5VKvv1IQMhZyphIVMrd8Hubns8ADei0aK4bIGKHxERw2rQ8KZMMI5oblWTgnin1hKDNilQeZvXweChWkXCpbGxe6mBvoeuKcMC7krxTtI3CvhM376bVxjNGiQFLWG2ScmDPY3X1jTUeejIDTz35ZhpmFD4eQY48e4rrm0MMA-IKvBu2riQqSlafpW8YqUA8rDxGSitouBD6Lv4zVCVEu8l83-I17Y5BXobq3WedfcKUZhrZGrxeMAdlbm_R4-AUwz4cpFdy_VN_uLKxVA-LJUrDRPA25w3N6bqYGaAdIxYmvsJjcignRNEQ6M5jn0yLPV46N9TEwifpUDrK0YwBi7wSxDMXgZiCWwEaSLaKwxXsDKZhZVk1vZS2yCFcu--VWFShr-KOrCFsk_0raObO61M6q5i0IuwS-kPFm3jjc-MaTbnaXASNTUlgCKGXTG7k4A5AQFpef1ko2RH44qcGuzlUcNgcGcKaiqDxp0a3hWiL6J6Qq3WS9WiyK4lJkL1MEiHWntQ9fULWnPpYa8DrrsEKDcgE2KvSvw4pQEXU2BhZ1otp2X-Fbz-IWbsxp7Asl5lAECMZpEL3sqdpeJSHEi2RWXCjlEr4423ACZA0THWYES2pAVt1xtBBGUpsu9d9FoK0xKmTkzohmfYkIkQcg8t5moaKi97k4t_OwsVZ8CcZCq6TjF4YqpkFxUbbe-GOkI_cO-HrQyhpvBp8dJ2NR1gSCqQWczIPfW5wwg5dnHOl46bw72qr7KUWD-yQ15tcxYDcFjXWcPeO9a6ElYWg88v9hGWjGo5P4WtG7lHPKgUV3VkpehXBQC-BURFk2UeIw9qwAZo86mu2fVfy1cuSCib9YIdbbN2Kx8twvn_FYgJSrMG